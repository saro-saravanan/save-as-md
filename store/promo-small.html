<!doctype html>
<!-- The Chrome Web Store small promo tile (440x280), rendered to promo-small.png by scripts/store-assets.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/fonts/fonts.css">
<style>
  :root { --ink: #1a2a44; --tomato: #d33a2c; --pea-deep: #2f6b2c; --brand: #1f883d; --display: 'Roboto Serif', Georgia, serif; --script: 'Yellowtail', cursive; }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { background: #efe3bd url(../site/assets/paper-ground.webp); background-blend-mode: multiply; color: var(--ink); }
  .frame { position: absolute; inset: 10px; border: 2px solid var(--pea-deep); border-radius: 4px; box-shadow: inset 0 0 0 5px rgba(248, 242, 223, .6), inset 0 0 0 6.5px var(--pea-deep); display: grid; place-content: center; justify-items: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: 10px; font: 900 22px/1 var(--display); font-stretch: 72%; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 14px; }
  .brand svg { width: 30px; height: 30px; }
  h1 { margin: 0; font: 900 62px/.9 var(--display); font-stretch: 62%; text-transform: uppercase; letter-spacing: .01em; }
  .script { font: 400 40px/1 var(--script); color: var(--tomato); margin-top: 4px; transform: rotate(-3deg); }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="20" fill="#1f883d"/><path fill="#fff" d="M43 16h14v34h-14z M25 44h50L50 70z M20 74h60v11H20z M20 60h11v25H20z M69 60h11v25H69z"/></svg>
      SaveMD
    </div>
    <h1>Save the page.</h1>
    <div class="script">Keep every image.</div>
  </div>
</body>
</html>
